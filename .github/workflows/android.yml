name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fix build.zig.zon formatting for current Zig version
        run: |
          # If the compiler expects a string literal but finds an enum literal (or vice versa), 
          # this robustly normalizes line 2 of build.zig.zon so compilation can proceed.
          if grep -q '\.name = \.' build.zig.zon; then
            sed -i 's/\.name = \.\([a-zA-Z0-9_-]*\)/\.name = "\1"/g' build.zig.zon
          elif grep -q '\.name = "' build.zig.zon; then
            sed -i 's/\.name = "\([a-zA-Z0-9_-]*\)"/.name = .\1/g' build.zig.zon
          fi
          cat build.zig.zon

      - name: Build Ursus for Android (ARM64 Musl)
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl --prefix dist
          
          mkdir -p dist/bin
          cp zig-out/bin/Ursus dist/bin/ursus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursus-android-arm64
          path: dist/bin/*
