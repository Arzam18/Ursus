name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Patch Code for Zig 0.16.0
        run: |
          # Fix potential GeneralPurposeAllocator namespace/naming change if needed, 
          # or handle standard 0.16 heap changes. Let's check how GeneralPurposeAllocator 
          # is structured or use standard page allocator fallback if it was deprecated.
          # In Zig 0.16, GPA moved or requires explicit general purpose handling. 
          # Let's sed-patch standard heap references if they shifted.
          echo "Checking src/main.zig..."
          grep -n "GeneralPurposeAllocator" src/main.zig || true

      - name: Build Ursus for Android (ARM64 Musl)
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl --prefix dist
          
          mkdir -p dist/bin
          cp zig-out/bin/Ursus dist/bin/ursus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursus-android-arm64
          path: dist/bin/*
