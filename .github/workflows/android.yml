name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Patch build.zig.zon for Zig 0.16 compatibility
        run: |
          # Fix any unquoted identifiers in build.zig.zon if present
          sed -i 's/\.name = \.\([a-zA-Z0-9_-]*\)/\.name = "\1"/g' build.zig.zon || true
          sed -i 's/\.dependency = \.\([a-zA-Z0-9_-]*\)/\.dependency = "\1"/g' build.zig.zon || true

      - name: Build Ursus for Android (ARM64 Musl)
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl --prefix dist
          
          mkdir -p dist/bin
          cp zig-out/bin/Ursus dist/bin/ursus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursus-android-arm64
          path: dist/bin/*
