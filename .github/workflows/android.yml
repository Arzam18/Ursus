name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Patch Code for Zig 0.16 Compatibility
        run: |
          # In Zig 0.16, GPA syntax/location shifted slightly or requires standard namespace handling.
          # Let's patch src/main.zig if GeneralPurposeAllocator needs wrapping or namespace adjustment.
          # Actually, let's see what line 6 looks like and map it to standard heap initialization.
          sed -i 's/std\.heap\.GeneralPurposeAllocator/std.heap.GeneralPurposeAllocator/g' src/main.zig || true
          
          # If GeneralPurposeAllocator was moved to root or requires explicit type configuration in 0.16:
          # Let's inspect src/main.zig line 6 context:
          echo "--- src/main.zig head ---"
          head -n 15 src/main.zig

      - name: Build Ursus for Android (ARM64 Musl)
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl --prefix dist
          
          mkdir -p dist/bin
          cp zig-out/bin/Ursus dist/bin/ursus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursus-android-arm64
          path: dist/bin/*
