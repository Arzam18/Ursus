name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Adapt build.zig.zon for Zig 0.13
        run: |
          # Ensure build.zig.zon parses cleanly under 0.13.0 by updating the minimum version string
          if [ -f build.zig.zon ]; then
            sed -i 's/\.minimum_version = .*/\.minimum_version = "0.13.0",/g' build.zig.zon || true
            sed -i 's/\.minimum_version\s*=\s*"[^"]*"/\.minimum_version = "0.13.0"/g' build.zig.zon || true
          fi

      - name: Build Ursus for Android (ARM64 Musl)
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl --prefix dist
          
          mkdir -p dist/bin
          cp zig-out/bin/Ursus dist/bin/ursus

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ursus-android-arm64
          path: dist/bin/*
